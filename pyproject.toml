[project]
name = "voicehack"
version = "0.1.0"
description = "Voice spectrum / noise separation / prosody (loudness, tone, speed) analysis"
readme = "README.md"
authors = [
    { name = "yuta-qwerty", email = "8thfp89f5x@privaterelay.appleid.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

[project.scripts]
voicehack = "voicehack.cli:main"

[project.optional-dependencies]
mic = [
    "sounddevice>=0.5.6",
]
asr = [
    "faster-whisper>=1.2.1",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
