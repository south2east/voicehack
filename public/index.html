<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voicehack — リアルタイム文字起こし</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>voicehack</h1>
      <p class="subtitle">Google Cloud Speech-to-Text (Chirp) でリアルタイム文字起こし + 録音・音声解析</p>
    </header>

    <section class="controls">
      <button id="startBtn" class="btn btn-start">● 開始</button>
      <button id="stopBtn" class="btn btn-stop" disabled>■ 終了</button>
      <span id="status" class="status">待機中</span>
    </section>
    <label class="option">
      <input type="checkbox" id="analyzeDnn" />
      終了後の解析で、声と重なった物音も分離する (深層学習・時間がかかる)
    </label>

    <section class="transcript-area">
      <h2>文字起こし</h2>
      <div id="finalText" class="final-text" aria-live="polite"></div>
      <div id="partialText" class="partial-text" aria-live="polite"></div>
    </section>

    <section class="analysis-area">
      <h2>音声解析</h2>
      <p id="analysisStatus" class="analysis-status">終了すると録音を解析します</p>
      <dl id="analysisMetrics" class="analysis-metrics"></dl>
      <div id="analysisPlayers" class="players"></div>
      <div id="analysisImages" class="analysis-images"></div>
    </section>

    <section class="result-area">
      <div class="result-header">
        <h2>セッション結果 (JSON)</h2>
        <div class="result-actions">
          <a id="audioDownload" class="btn btn-secondary btn-link is-disabled" href="#" download>音声(MP4)をダウンロード</a>
          <button id="downloadBtn" class="btn btn-secondary" disabled>JSONをダウンロード</button>
        </div>
      </div>
      <pre id="jsonOutput" class="json-output">まだセッションがありません</pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
